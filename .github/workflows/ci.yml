name: CI

on:
    pull_request:
    push:
        branches:
            - main

permissions:
    contents: read
    pull-requests: write

jobs:
    build_and_deploy:
        name: Build and Deploy
        runs-on: ubuntu-latest

        env:
            CURRENT_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

        outputs:
            preview_url: ${{ steps.deploy.outputs.deployment-url }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Setup pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: 10.33.0

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version-file: '.nvmrc'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # Verify only. Formatting/linting is auto-fixed locally via the
            # husky + lint-staged pre-commit hook, so CI must NOT rewrite the PR
            # HEAD. Pushing an auto-fix commit here (previously with [skip ci])
            # left the required status checks stuck on a commit that CI never
            # runs against.
            - name: Lint
              run: pnpm run lint

            - name: Check formatting
              run: pnpm run format:check

            - name: Type check
              run: pnpm run type-check

            - name: Build
              run: pnpm build

            # Preview deployments require Cloudflare secrets, which are not
            # available to Dependabot or fork pull requests. Skip the deploy in
            # those cases so the required "Build and Deploy" check can still pass.
            - name: Deploy to Cloudflare Pages
              id: deploy
              if: >-
                  github.event_name == 'push' ||
                  (github.actor != 'dependabot[bot]' &&
                  github.event.pull_request.head.repo.full_name == github.repository)
              uses: cloudflare/wrangler-action@v4
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  command: pages deploy dist --project-name="website-kelderro-nl" --branch="${{ env.CURRENT_BRANCH }}"
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    e2e:
        name: E2E tests
        # Playwright starts its own local astro dev server (see
        # playwright.config.ts), so these tests need neither the deployment nor
        # any secrets. Keeping this job independent lets it pass for Dependabot
        # and run in parallel with the build.
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Setup pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: 10.33.0

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version-file: '.nvmrc'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Install Playwright browsers
              run: pnpm exec playwright install --with-deps chromium firefox webkit

            - name: Run Playwright tests
              run: pnpm exec playwright test
              env:
                  CI: true
                  WRANGLER_SEND_METRICS: false

            - name: Upload Playwright report
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 7

    lighthouse:
        name: Lighthouse CI
        needs: build_and_deploy
        # Requires a preview deployment (and Cloudflare Access secrets), so it
        # can only run for non-Dependabot pull requests from this repository.
        if: >-
            github.event_name == 'pull_request' &&
            github.actor != 'dependabot[bot]' &&
            github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-latest
        env:
            PREVIEW_URL: ${{ needs.build_and_deploy.outputs.preview_url }}

        steps:
            - name: Setup pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: 10.33.0

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 22

            - name: Create lighthouserc.json with Zero Trust Headers
              # is-crawlable is disabled because Cloudflare Pages automatically adds
              # 'noindex' headers to preview deployments, causing this audit to always
              # fail in CI regardless of the actual site configuration.
              run: |
                  cat << 'EOF' > lighthouserc.json
                  {
                    "ci": {
                      "collect": {
                        "numberOfRuns": 1,
                        "settings": {
                          "extraHeaders": {
                            "CF-Access-Client-Id": "${{ secrets.CF_ACCESS_CLIENT_ID }}",
                            "CF-Access-Client-Secret": "${{ secrets.CF_ACCESS_CLIENT_SECRET }}"
                          },
                          "skipAudits": ["is-crawlable"]
                        }
                      },
                      "assert": {
                        "preset": "lighthouse:recommended",
                        "assertions": {
                          "is-crawlable": "off",
                          "forced-reflow-insight": "warn",
                          "image-delivery-insight": "warn",
                          "lcp-discovery-insight": "warn",
                          "network-dependency-tree-insight": "warn",
                          "prioritize-lcp-image": "warn",
                          "target-size": "warn",
                          "unused-javascript": "warn"
                        }
                      }
                    }
                  }
                  EOF

            - name: Run Lighthouse CI
              run: |
                  pnpm dlx @lhci/cli autorun \
                    --collect.url="$PREVIEW_URL" \
                    --upload.target=filesystem \
                    --upload.outputDir="./lhci-report"

            - name: Upload Lighthouse report
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: lighthouse-report
                  path: lhci-report

            - name: Comment Lighthouse results on PR
              if: always()
              uses: marocchino/sticky-pull-request-comment@v3
              with:
                  message: |
                      🔍 **Lighthouse CI Report**

                      Preview URL: ${{ env.PREVIEW_URL }}

                      A full Lighthouse report has been generated and uploaded as an artifact.

                      Categories audited:
                      - Performance  
                      - Accessibility  
                      - Best Practices  
                      - SEO
